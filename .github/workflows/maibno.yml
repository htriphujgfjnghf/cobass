name: 🎭 Playwright - Jalankan Perintah di JupyterLab

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Perintah yang dijalankan di terminal JupyterLab'
        required: false
        default: 'lscpu'
      jupyter_token:
        description: 'Token login JupyterLab (default: huggingface)'
        required: false
        default: 'huggingface'

jobs:
  run-per-account:
    strategy:
      fail-fast: false
      matrix:
        account:
          - id: "acc1"
            secret_key: "HF_TOKEN_ACC1"
          - id: "acc2"
            secret_key: "HF_TOKEN_ACC2"
          # tambah akun lain sesuai kebutuhan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Buat script Playwright
        run: |
          cat > run_jupyter.mjs << 'SCRIPT_END'
          import { chromium } from 'playwright';

          const HF_TOKEN     = process.env.HF_TOKEN;
          const COMMAND      = process.env.COMMAND      || 'lscpu';
          const JUPYTER_TOKEN = process.env.JUPYTER_TOKEN || 'huggingface';

          // ─── HF REST helpers ──────────────────────────────────────────────

          async function hfGet(path) {
            const r = await fetch(`https://huggingface.co${path}`, {
              headers: { Authorization: `Bearer ${HF_TOKEN}` },
            });
            if (!r.ok) throw new Error(`HF API ${path} => HTTP ${r.status}`);
            return r.json();
          }

          async function hfPost(path) {
            const r = await fetch(`https://huggingface.co${path}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${HF_TOKEN}` },
            });
            return r.ok;
          }

          async function getUsername() {
            const data = await hfGet('/api/whoami-v2');
            return data.name;
          }

          async function listSpaces(username) {
            const data = await hfGet(`/api/spaces?author=${username}&limit=200`);
            return data.map(s => s.id);
          }

          async function getStage(repoId) {
            const data = await hfGet(`/api/spaces/${repoId}/runtime`);
            return data.stage;
          }

          async function restartSpace(repoId) {
            await hfPost(`/api/spaces/${repoId}/restart`);
          }

          async function waitForRunning(repoId, timeoutMs = 600_000) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              const stage = await getStage(repoId);
              console.log(`   Status: ${stage}`);
              if (stage === 'RUNNING') return true;
              await sleep(10_000);
            }
            return false;
          }

          const sleep = ms => new Promise(r => setTimeout(r, ms));

          // ─── Playwright helpers ───────────────────────────────────────────

          /**
           * Login ke JupyterLab jika halaman login muncul.
           * Halaman login punya input[name="password"] dan button#login_submit.
           */
          async function loginIfNeeded(page) {
            // Tunggu sebentar agar halaman stabil
            await page.waitForTimeout(3000);

            const pwInput = page.locator('input[name="password"], input#password_input, input[type="password"]');
            const isLoginPage = await pwInput.isVisible({ timeout: 8000 }).catch(() => false);

            if (isLoginPage) {
              console.log('   🔑 Halaman login ditemukan → memasukkan token...');
              await pwInput.fill(JUPYTER_TOKEN);
              // Klik tombol Log in
              await page.click('button#login_submit, button[type="submit"], .btn-jupyter');
              // Tunggu redirect ke JupyterLab
              await page.waitForURL(url => !url.toString().includes('/login'), { timeout: 30_000 });
              console.log('   ✅ Login berhasil');
            } else {
              console.log('   ℹ️  Tidak ada halaman login (langsung masuk JupyterLab)');
            }
          }

          /**
           * Tunggu JupyterLab selesai loading (Launcher atau panel utama muncul).
           */
          async function waitForJupyterLab(page) {
            await page.waitForSelector(
              '#jp-main-dock-panel, .jp-Launcher, .jp-NotebookPanel',
              { timeout: 90_000 }
            );
            // Beri waktu JupyterLab inisialisasi penuh
            await page.waitForTimeout(3000);
          }

          /**
           * Buka terminal baru di JupyterLab.
           * Coba via Launcher tile dulu, fallback ke menu File → New → Terminal.
           */
          async function openTerminal(page) {
            // Coba klik tile "Terminal" di Launcher
            const tile = page.locator('.jp-LauncherCard-label:has-text("Terminal"), .jp-Launcher text=Terminal').first();
            const tileVisible = await tile.isVisible({ timeout: 5000 }).catch(() => false);

            if (tileVisible) {
              await tile.click();
              console.log('   💻 Terminal dibuka via Launcher');
            } else {
              // Fallback: File → New → Terminal
              console.log('   🗂️  Tile tidak terlihat, coba via menu File...');
              await page.click('.jp-MenuBar-itemLabel >> text=File');
              await page.waitForTimeout(500);
              await page.click('.lm-Menu-itemLabel >> text=New');
              await page.waitForTimeout(500);
              await page.click('.lm-Menu-itemLabel >> text=Terminal');
              console.log('   💻 Terminal dibuka via menu File → New → Terminal');
            }

            // Tunggu terminal siap
            await page.waitForSelector('.jp-Terminal-body, .xterm-helper-textarea', { timeout: 30_000 });
            await page.waitForTimeout(2000);
          }

          /**
           * Ketik perintah di terminal dan ambil output-nya.
           */
          async function runCommand(page, command) {
            // Klik ke area terminal agar fokus
            const termBody = page.locator('.jp-Terminal-body, .xterm-helper-textarea').first();
            await termBody.click();

            // Ketik perintah
            await page.keyboard.type(command);
            await page.keyboard.press('Enter');

            // Tunggu perintah selesai (sederhana: tunggu 6 detik)
            await page.waitForTimeout(6000);

            // Ambil output dari DOM terminal (xterm.js DOM mode)
            const output = await page.evaluate(() => {
              // xterm.js merender baris sebagai <div> di dalam .xterm-rows
              const rows = document.querySelectorAll('.xterm-rows > div');
              if (rows.length > 0) {
                return Array.from(rows).map(r => r.innerText || r.textContent).join('\n');
              }
              // Fallback: ambil semua teks dari .jp-Terminal-body
              const body = document.querySelector('.jp-Terminal-body');
              return body ? body.innerText : '';
            });

            return output;
          }

          // ─── Main ─────────────────────────────────────────────────────────

          (async () => {
            let username;
            try {
              username = await getUsername();
              console.log(`👤 Username: ${username}`);
            } catch (e) {
              console.error(`❌ Gagal get username: ${e.message}`);
              process.exit(1);
            }

            let spaces;
            try {
              spaces = await listSpaces(username);
              console.log(`📋 ${spaces.length} Space ditemukan:`);
              spaces.forEach(s => console.log(`   - ${s}`));
            } catch (e) {
              console.error(`❌ Gagal list spaces: ${e.message}`);
              process.exit(1);
            }

            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox'],
            });

            for (const repoId of spaces) {
              console.log(`\n${'='.repeat(50)}`);
              console.log(`🔧 Memproses: ${repoId}`);

              const page = await browser.newPage();
              // Tangkap error konsol browser untuk debugging
              page.on('console', msg => {
                if (msg.type() === 'error') console.log(`   [browser error] ${msg.text()}`);
              });

              try {
                // 1. Pastikan Space RUNNING
                let stage = await getStage(repoId);
                console.log(`   Status awal: ${stage}`);

                if (stage !== 'RUNNING') {
                  console.log('🔄 Me-restart Space...');
                  await restartSpace(repoId);
                  const ok = await waitForRunning(repoId);
                  if (!ok) {
                    console.log('⏰ Timeout menunggu Space running. Lewati.');
                    continue;
                  }
                  console.log('   ⏳ Menunggu 20 detik agar Space stabil...');
                  await sleep(20_000);
                }

                // 2. Buka Space di Playwright
                const spaceUrl = `https://${repoId.replace('/', '-')}.hf.space`;
                console.log(`   🌐 Membuka: ${spaceUrl}`);

                await page.goto(spaceUrl, { waitUntil: 'domcontentloaded', timeout: 60_000 });

                // 3. Login jika diperlukan
                await loginIfNeeded(page);

                // 4. Tunggu JupyterLab siap
                console.log('   ⏳ Menunggu JupyterLab...');
                await waitForJupyterLab(page);
                console.log('   ✅ JupyterLab siap');

                // 5. Buka terminal
                await openTerminal(page);

                // 6. Jalankan perintah
                console.log(`   ▶️  Menjalankan: ${COMMAND}`);
                const output = await runCommand(page, COMMAND);

                console.log('📤 Output:');
                console.log(output.trim() || '(tidak ada output)');

                // Screenshot untuk debugging (opsional, lihat di artifacts)
                await page.screenshot({ path: `screenshot_${repoId.replace('/', '_')}.png` });
                console.log(`   📸 Screenshot disimpan`);

                console.log('✅ Selesai');

              } catch (e) {
                console.log(`❌ Gagal di ${repoId}: ${e.message}`);
                // Screenshot saat error
                await page.screenshot({ path: `error_${repoId.replace('/', '_')}.png` }).catch(() => {});
              } finally {
                await page.close();
              }
            }

            await browser.close();
            console.log(`\n🎉 Akun ${username} selesai diproses.`);
          })();
          SCRIPT_END

      - name: Jalankan Playwright - Akun ${{ matrix.account.id }}
        env:
          HF_TOKEN: ${{ secrets[matrix.account.secret_key] }}
          COMMAND: ${{ github.event.inputs.command }}
          JUPYTER_TOKEN: ${{ github.event.inputs.jupyter_token }}
        run: node run_jupyter.mjs

      - name: Upload screenshots (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.account.id }}
          path: "*.png"
          if-no-files-found: ignore
