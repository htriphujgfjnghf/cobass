name: 🎭 Playwright - Jalankan Perintah di JupyterLab

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Perintah yang dijalankan di terminal JupyterLab'
        required: false
        default: 'lscpu'
      jupyter_token:
        description: 'Token JupyterLab (default: huggingface)'
        required: false
        default: 'huggingface'

jobs:
  run-per-account:
    strategy:
      fail-fast: false
      matrix:
        account:
          - id: "acc1"
            hf_token_key: "HF_TOKEN_ACC1"
          - id: "acc2"
            hf_token_key: "HF_TOKEN_ACC2"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Buat script Playwright
        run: |
          cat > run_jupyter.mjs << 'SCRIPT_END'
          import { chromium } from 'playwright';

          const HF_TOKEN      = process.env.HF_TOKEN;
          const COMMAND       = process.env.COMMAND       || 'lscpu';
          const JUPYTER_TOKEN = process.env.JUPYTER_TOKEN || 'huggingface';

          const sleep = ms => new Promise(r => setTimeout(r, ms));

          // ─── HF REST API (list spaces & restart) ─────────────────────────

          async function hfGet(path) {
            const r = await fetch(`https://huggingface.co${path}`, {
              headers: { Authorization: `Bearer ${HF_TOKEN}` },
            });
            if (!r.ok) throw new Error(`HF API ${path} → HTTP ${r.status}`);
            return r.json();
          }

          async function hfPost(path) {
            const r = await fetch(`https://huggingface.co${path}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${HF_TOKEN}` },
            });
            return r.ok;
          }

          async function getUsername()        { return (await hfGet('/api/whoami-v2')).name; }
          async function listSpaces(username) { return (await hfGet(`/api/spaces?author=${username}&limit=200`)).map(s => s.id); }
          async function getStage(repoId)     { return (await hfGet(`/api/spaces/${repoId}/runtime`)).stage; }
          async function restartSpace(repoId) { return hfPost(`/api/spaces/${repoId}/restart`); }

          async function waitForRunning(repoId, timeoutMs = 600_000) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              const stage = await getStage(repoId);
              console.log(`   Status: ${stage}`);
              if (stage === 'RUNNING') return true;
              await sleep(10_000);
            }
            return false;
          }

          // ─── Playwright: akses JupyterLab langsung via URL+token ─────────

          /**
           * Cek dan isi form login JupyterLab jika muncul.
           * Dicoba dua cara: via URL token dan via form manual.
           */
          async function handleJupyterLogin(page, safeId) {
            // Tunggu halaman stabil dulu
            await sleep(3_000);

            const currentUrl = page.url();
            const title      = await page.title();
            console.log(`   📄 URL: ${currentUrl} | Judul: ${title}`);
            await page.screenshot({ path: `debug_before_login_${safeId}.png` });

            // Cek apakah ada form login JupyterLab
            // Selector PASTI: #password_input (dikonfirmasi dari DOM)
            const pwInput = page.locator('#password_input').first();
            const isLoginPage = await pwInput.isVisible({ timeout: 10_000 }).catch(() => false);

            if (!isLoginPage) {
              console.log('   ℹ️  Tidak ada form login → sudah masuk JupyterLab');
              return;
            }

            console.log('   🔑 #password_input ditemukan → isi token...');

            // Log semua tombol submit yang ada di halaman untuk debug
            const allBtns = await page.evaluate(() =>
              Array.from(document.querySelectorAll('button, input[type="submit"]'))
                .map(b => `${b.tagName}#${b.id || '?'}.${b.className || '?'} text="${b.innerText || b.value || ''}"`)
            );
            console.log(`   🔍 Tombol di halaman: ${allBtns.join(' | ')}`);

            // Isi token ke #password_input
            await pwInput.click({ clickCount: 3 });
            await pwInput.fill(JUPYTER_TOKEN);
            await sleep(500);
            await page.screenshot({ path: `debug_login_filled_${safeId}.png` });
            console.log(`   ✏️  Token "${JUPYTER_TOKEN}" sudah diisi ke #password_input`);

            // Coba klik #login_submit dulu (selector paling umum di JupyterLab)
            // Fallback ke selector lain, terakhir tekan Enter
            const loginBtn = page.locator([
              '#login_submit',
              'button[type="submit"]',
              'input[type="submit"]',
              '.btn-jupyter',
              'button:has-text("Log in")',
              'button:has-text("Login")',
            ].join(', ')).first();

            const btnVisible = await loginBtn.isVisible({ timeout: 5_000 }).catch(() => false);

            if (btnVisible) {
              const btnId = await loginBtn.getAttribute('id').catch(() => '?');
              console.log(`   🖱️  Klik tombol: #${btnId}`);
              await Promise.all([
                page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 30_000 }),
                loginBtn.click(),
              ]);
              console.log('   ✅ Login Jupyter berhasil (klik tombol)');
            } else {
              console.log('   ⌨️  Tidak ada tombol → tekan Enter...');
              await Promise.all([
                page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 30_000 }),
                pwInput.press('Enter'),
              ]);
              console.log('   ✅ Login Jupyter berhasil (Enter)');
            }

            await sleep(3_000);
            await page.screenshot({ path: `debug_after_login_${safeId}.png` });
          }

          async function processSpace(browser, repoId) {
            const base   = `https://${repoId.replace('/', '-').toLowerCase()}.hf.space`;
            const safeId = repoId.replace('/', '_');

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
            });

            const page = await context.newPage();
            page.on('console', msg => {
              if (msg.type() === 'error') {
                const t = msg.text();
                if (!t.includes('favicon') && !t.includes('.map') &&
                    !t.includes('404') && !t.includes('Connection lost'))
                  console.log(`   [browser] ${t.substring(0, 120)}`);
              }
            });

            try {
              // ── 1. Coba buka langsung via URL+token (bypass login jika bisa) ──
              const labWithToken = `${base}/lab?token=${JUPYTER_TOKEN}`;
              console.log(`   🌐 Membuka: ${labWithToken}`);
              await page.goto(labWithToken, { waitUntil: 'domcontentloaded', timeout: 60_000 });

              // ── 2. Handle form login jika muncul ──────────────────────────
              await handleJupyterLogin(page, safeId);

              // Jika URL masih di /login, navigasi manual ke /lab
              if (page.url().includes('/login')) {
                console.log('   🔄 Masih di halaman login, coba navigasi ke /lab...');
                await page.goto(`${base}/lab`, { waitUntil: 'domcontentloaded', timeout: 30_000 });
                await handleJupyterLogin(page, safeId);
              }

              // ── 3. Tunggu JupyterLab siap ─────────────────────────────────
              console.log('   ⏳ Menunggu JupyterLab...');
              await page.waitForSelector(
                '#jp-main-dock-panel, .jp-Launcher, .jp-LabShell, .jp-NotebookPanel',
                { timeout: 90_000 }
              );
              await sleep(5_000);
              console.log('   ✅ JupyterLab siap');

              // ── 4. Buka terminal ──────────────────────────────────────────
              const tile = page.locator('.jp-LauncherCard-label')
                .filter({ hasText: 'Terminal' }).first();
              if (await tile.isVisible({ timeout: 6_000 }).catch(() => false)) {
                await tile.click();
                console.log('   💻 Terminal dibuka via Launcher');
              } else {
                console.log('   🗂️  Buka via menu File → New → Terminal...');
                await page.locator('.jp-MenuBar-itemLabel').filter({ hasText: 'File' }).click();
                await sleep(400);
                await page.locator('.lm-Menu-itemLabel').filter({ hasText: 'New' }).click();
                await sleep(400);
                await page.locator('.lm-Menu-itemLabel').filter({ hasText: 'Terminal' }).click();
              }

              await page.waitForSelector(
                '.jp-Terminal-body, .xterm-helper-textarea',
                { timeout: 30_000 }
              );

              // FIX: tunggu sampai terminal stabil — tidak ada "reconnecting" di terminal
              // "Connection lost, reconnecting" terjadi karena WebSocket belum siap
              console.log('   ⏳ Menunggu koneksi terminal stabil...');
              await page.waitForFunction(() => {
                const rows = document.querySelectorAll('.xterm-rows > div');
                const text = Array.from(rows).map(r => r.textContent || '').join('');
                // Terminal siap jika sudah ada prompt ($ atau # atau ~)
                // dan tidak sedang "reconnecting"
                return text.length > 0 && !text.includes('reconnecting');
              }, { timeout: 60_000, polling: 2_000 }).catch(() => {
                console.log('   ⚠️  Timeout tunggu prompt, coba lanjut...');
              });

              await sleep(3_000);
              console.log('   ✅ Terminal stabil');

              // ── 5. Kirim perintah & ambil output ─────────────────────────
              const termBody = page.locator('.jp-Terminal-body, .xterm-helper-textarea').first();
              await termBody.click();

              // Baca teks terminal sebelum kirim perintah (untuk dibandingkan nanti)
              const before = await page.evaluate(() => {
                const rows = document.querySelectorAll('.xterm-rows > div');
                return Array.from(rows).map(r => r.textContent || '').join('\n');
              });

              await page.keyboard.type(COMMAND);
              await page.keyboard.press('Enter');

              // Tunggu output baru muncul (bandingkan dengan konten sebelum)
              console.log(`   ▶️  Perintah dikirim: ${COMMAND}`);
              await page.waitForFunction((prevText) => {
                const rows = document.querySelectorAll('.xterm-rows > div');
                const current = Array.from(rows).map(r => r.textContent || '').join('\n');
                return current.length > prevText.length;
              }, before, { timeout: 30_000, polling: 1_000 }).catch(() => {
                console.log('   ⚠️  Timeout tunggu output, coba baca sekarang...');
              });

              // Tunggu perintah selesai (prompt kembali muncul)
              await sleep(5_000);

              const output = await page.evaluate(() => {
                const rows = document.querySelectorAll('.xterm-rows > div');
                if (rows.length > 0)
                  return Array.from(rows).map(r => r.innerText || r.textContent || '').join('\n');
                const body = document.querySelector('.jp-Terminal-body');
                return body ? (body.innerText || body.textContent || '') : '';
              });

              console.log('📤 Output:');
              console.log(output.trim() || '(tidak ada output)');

              await page.screenshot({ path: `done_${safeId}.png` });
              console.log('✅ Selesai');

            } catch (e) {
              console.log(`❌ Error: ${e.message}`);
              await page.screenshot({ path: `error_${safeId}.png`, fullPage: true }).catch(() => {});
            } finally {
              await context.close();
            }
          }

          // ─── Main ─────────────────────────────────────────────────────────

          (async () => {
            const username = await getUsername().catch(e => { console.error(`❌ ${e.message}`); process.exit(1); });
            console.log(`👤 Username: ${username}`);

            const spaces = await listSpaces(username).catch(e => { console.error(`❌ ${e.message}`); process.exit(1); });
            console.log(`📋 ${spaces.length} Space ditemukan:`);
            spaces.forEach(s => console.log(`   - ${s}`));

            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox'],
            });

            for (const repoId of spaces) {
              console.log(`\n${'='.repeat(50)}`);
              console.log(`🔧 Memproses: ${repoId}`);

              try {
                // Restart Space jika belum running
                const stage = await getStage(repoId);
                console.log(`   Status awal: ${stage}`);
                if (stage !== 'RUNNING') {
                  console.log('🔄 Me-restart Space...');
                  await restartSpace(repoId);
                  const ok = await waitForRunning(repoId);
                  if (!ok) { console.log('⏰ Timeout. Lewati.'); continue; }
                  console.log('   ⏳ Tunggu 20 detik agar stabil...');
                  await sleep(20_000);
                }

                await processSpace(browser, repoId);

              } catch (e) {
                console.log(`❌ Gagal di ${repoId}: ${e.message}`);
              }
            }

            await browser.close();
            console.log(`\n🎉 Akun ${username} selesai diproses.`);
          })();
          SCRIPT_END

      - name: Jalankan Playwright - Akun ${{ matrix.account.id }}
        env:
          HF_TOKEN:      ${{ secrets[matrix.account.hf_token_key] }}
          COMMAND:       ${{ github.event.inputs.command }}
          JUPYTER_TOKEN: ${{ github.event.inputs.jupyter_token }}
        run: node run_jupyter.mjs

      - name: Upload screenshots (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.account.id }}
          path: "*.png"
          if-no-files-found: ignore
