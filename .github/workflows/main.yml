name: 🔧 Buktikan Perintah Berjalan di Space JupyterLab

on:
  workflow_dispatch:
    inputs:
      perintah:
        description: 'Perintah (bawaan: hostname)'
        default: 'hostname'

jobs:
  jalankan:
    runs-on: ubuntu-latest
    steps:
      - run: pip install huggingface_hub requests websocket-client
      - name: Kirim perintah ke Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COMMAND: ${{ github.event.inputs.perintah }}
        shell: python
        run: |
          import os, time, json, requests, websocket
          from huggingface_hub import HfApi

          HF_TOKEN = os.environ["HF_TOKEN"]
          COMMAND = os.environ["COMMAND"]
          JUPYTER_TOKEN = "huggingface"   # pastikan Space-mu sudah kosong tokennya

          api = HfApi(token=HF_TOKEN)
          user = api.whoami()["name"]
          space_name = "nama-space-kamu"   # GANTI dengan nama Space kamu
          repo_id = f"{user}/{space_name}"

          # Cek status & restart jika tidak running
          runtime = api.get_space_runtime(repo_id)
          print(f"Status: {runtime.stage}")
          if str(runtime.stage) != "RUNNING":
              api.restart_space(repo_id)
              for _ in range(60):
                  time.sleep(10)
                  if str(api.get_space_runtime(repo_id).stage) == "RUNNING":
                      break

          # Tunggu JupyterLab siap
          time.sleep(10)

          # Buat terminal
          base = f"https://{repo_id.replace('/', '-')}.hf.space"
          headers = {"Authorization": f"Bearer {HF_TOKEN}"}
          r = requests.post(f"{base}/api/terminals", headers=headers)
          r.raise_for_status()
          term = r.json()["name"]
          print(f"Terminal dibuat: {term}")

          # WebSocket kirim perintah
          ws = websocket.create_connection(
              f"wss://{repo_id.replace('/', '-')}.hf.space/terminals/websocket/{term}",
              header={"Authorization": f"Bearer {HF_TOKEN}"},
              timeout=10
          )
          ws.send(json.dumps(["stdin", COMMAND + "\n"]))
          time.sleep(2)
          ws.settimeout(5)
          output = ""
          while True:
              try:
                  data = json.loads(ws.recv())
                  if data[0] == "stdout":
                      output += data[1]
              except:
                  break
          ws.close()
          requests.delete(f"{base}/api/terminals/{term}", headers=headers)
          print("📤 Output dari Space:")
          print(output.strip() or "(kosong)")